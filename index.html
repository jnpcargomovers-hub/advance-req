<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>JNP Cargo Movers - Advance Payment Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input, select, textarea { font-size: 16px !important; }
    .autocomplete-list { max-height: 200px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    body { padding-bottom: env(safe-area-inset-bottom, 25px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-6" onclick="closeAllDropdowns()">
  <div class="max-w-md mx-auto bg-white shadow-xl rounded-2xl p-4 sm:p-5 border border-slate-200" onclick="event.stopPropagation()">
    
    <!-- Top Bar with Logo & Navigation -->
    <div class="border-b border-slate-200 pb-3 mb-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <!-- Logo Image with Clean Inline Brand Fallback -->
        <div class="flex-shrink-0">
          <img 
            id="brandLogo"
            src="logo.png" 
            alt="JNP Cargo Movers" 
            class="h-11 w-auto object-contain"
            onerror="document.getElementById('brandLogo').classList.add('hidden'); document.getElementById('brandFallback').classList.remove('hidden');"
          />
          <div id="brandFallback" class="hidden h-11 w-14 bg-blue-950 rounded-xl flex flex-col items-center justify-center text-white shadow-sm">
            <span class="font-black text-sm italic tracking-tighter leading-none">JNP</span>
            <span class="text-[7px] font-bold text-amber-400 tracking-wider">CARGO</span>
          </div>
        </div>
        <div class="border-l border-slate-200 pl-2.5">
          <h1 class="text-xs sm:text-sm font-extrabold text-amber-800 tracking-tight leading-tight uppercase">ADVANCE PAYMENT</h1>
          <p class="text-[10px] text-slate-500 font-semibold tracking-wider">एडवांस पेमेंट रिक्वेस्ट</p>
        </div>
      </div>
      <button type="button" onclick="fetchMasters()" class="text-xs text-amber-800 font-bold hover:underline py-1 px-2.5 rounded-lg bg-amber-50 border border-amber-200">↻ Sync</button>
    </div>

    <!-- Active Form -->
    <form id="advanceForm" onsubmit="handleFormSubmit(event)" class="space-y-3" autocomplete="off">
      
      <!-- Submitted By -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Request Submitted By *</label>
        <select id="staffSelect" onchange="toggleCustomStaff()" required class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium">
          <option value="">Select Staff...</option>
        </select>
        <input type="text" id="staffCustom" placeholder="Enter your name" class="hidden mt-1.5 w-full border border-amber-400 rounded-xl p-2.5 bg-amber-50 font-medium" />
      </div>

      <!-- Driver Name & Truck Number -->
      <div class="relative">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">1. Driver Name *</label>
        <input 
          type="text" 
          id="driverInput" 
          required 
          placeholder="Type driver name..." 
          class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold focus:bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none"
          oninput="filterOptions('driver', this.value)"
          onfocus="filterOptions('driver', this.value)"
        />
        <div id="driverDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
      </div>

      <div class="relative">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">2. Truck Number *</label>
        <input 
          type="text" 
          id="truckInput" 
          required 
          placeholder="e.g. MH18BZ0271 or 0271" 
          class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold uppercase tracking-wide focus:bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none"
          oninput="filterOptions('truck', this.value)"
          onfocus="filterOptions('truck', this.value)"
        />
        <div id="truckDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
      </div>

      <!-- Total Payment Due & Advance Requested -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">3. Total Due (₹)</label>
          <input type="number" step="any" id="totalDue" placeholder="e.g. 15000" class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium text-slate-700" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">4. Advance Req (₹) *</label>
          <input type="number" step="any" id="advRequested" required placeholder="e.g. 3000" class="w-full border rounded-xl p-2.5 bg-slate-50 font-bold text-amber-900" />
        </div>
      </div>

      <!-- Date of Credit & Guarantor -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">5. Date of Credit Needed *</label>
        <input type="date" id="dateOfCredit" required class="w-full border rounded-xl p-2.5 bg-slate-50 font-semibold text-slate-800" />
      </div>

      <div class="relative">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">6. Guarantor / Recommended By *</label>
        <input 
          type="text" 
          id="guarantorInput" 
          required 
          placeholder="Guarantor name (e.g. Senior Driver / Manager)" 
          class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium focus:bg-white focus:ring-2 focus:ring-amber-500"
          oninput="filterOptions('guarantor', this.value)"
          onfocus="filterOptions('guarantor', this.value)"
        />
        <div id="guarantorDropdown" class="autocomplete-list hidden absolute z-30 w-full bg-white border border-slate-300 rounded-xl shadow-2xl mt-1"></div>
      </div>

      <!-- Remark -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">7. Remark / Purpose</label>
        <input type="text" id="remarkInput" placeholder="Reason (e.g. En-route emergency, Toll cash)" class="w-full border rounded-xl p-2.5 bg-slate-50 font-medium" />
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit" id="saveBtn" class="w-full py-3 bg-amber-600 active:bg-amber-800 text-white font-bold text-sm rounded-xl shadow-lg transition">
          Record Request & Generate WhatsApp
        </button>
      </div>
    </form>

    <!-- WhatsApp Share Panel -->
    <div id="shareSection" class="hidden mt-4 p-4 border border-emerald-300 bg-emerald-50 rounded-xl space-y-2.5">
      <div class="flex items-center gap-2">
        <span class="text-lg">✅</span>
        <h3 class="text-xs font-bold text-emerald-950 uppercase tracking-wide">Recorded! Send for Approval:</h3>
      </div>

      <button type="button" id="shareBtn" onclick="handleWhatsAppShare()" class="w-full py-3 bg-emerald-600 active:bg-emerald-800 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow">
        <span>📲</span> Forward Advance Request on WhatsApp
      </button>

      <button type="button" onclick="resetForm()" class="w-full py-2.5 bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-xs rounded-xl transition">
        ➕ New Request
      </button>
    </div>

    <div id="statusToast" class="hidden mt-3 text-center text-xs font-bold p-2.5 rounded-xl"></div>
  </div>

  <script>
    // Live Web App URL for Advance Payment Request
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGTv6YBnyXJ8SEMFTEVmkupwLdNC2f3-PcT2NLexc325Z2lDcAAjR4QHPs8eA7inze8g/exec";

    let lastSavedData = null;

    // Initial Master Data calibrated directly with your live Google Sheet
    let masterData = {
      staff: ["Sumit", "Ganesh", "Atul", "Ganesh HO"],
      drivers: [
        "Akil Khan", "Shakil Khan", "Feroz Khan", "Sanjay Khabre", "Devidas Patil",
        "Pramod Sonwane", "Md Ibarar", "Rahul Pal", "Rajesh Sharma", "Krishnakumar Sahu",
        "Ranjit Soni", "Bhatu Mahale", "Abdullah", "Mahendra Vishwakarma", "Pravin Bhoir",
        "Sintu Yadav", "Sunil Sahu", "Omprakash Sahu", "Ashok Sahu", "Md Sageer",
        "Tinku Yadav", "Md Miraj", "Shoeb Pathan", "Kailash Patil"
      ],
      trucks: [
        "MH40CM8975", "MH40BL4725", "MH18BZ0274", "MH40CM1550", "MH18BZ0106",
        "MH18BZ0107", "MH14KA9717", "MH40CM2748", "MH40DC1236", "MH18BZ0112",
        "MH40CM1569", "OD01AB2773", "UP95T9393", "MH40CM1570", "CG07CG1594",
        "MH18BZ0105", "MH18BZ0109", "OD01AB2873", "AP04UB2935", "CG07CG1595",
        "CG07CG1596", "MH21BH4147", "MH18BZ0268", "MH18BZ0269"
      ],
      guarantors: ["Sumit", "Ganesh", "Atul", "Branch Manager", "Self"]
    };

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateOfCredit').value = today;
      populateStaff(masterData.staff);
      fetchMasters();
    });

    async function fetchMasters() {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (res.ok) {
          const liveData = await res.json();
          if (liveData) {
            if (Array.isArray(liveData.staff) && liveData.staff.length > 0) {
              masterData.staff = liveData.staff;
              populateStaff(masterData.staff);
            }
            if (Array.isArray(liveData.drivers) && liveData.drivers.length > 0) {
              masterData.drivers = liveData.drivers;
            }
            if (Array.isArray(liveData.trucks) && liveData.trucks.length > 0) {
              masterData.trucks = liveData.trucks;
            }
            if (Array.isArray(liveData.guarantors) && liveData.guarantors.length > 0) {
              masterData.guarantors = liveData.guarantors;
            }
            showToast("Synced with Google Sheet Masters!", "emerald");
            setTimeout(hideToast, 2000);
          }
        }
      } catch (e) {
        console.warn("Using offline master cache", e);
      }
    }

    function populateStaff(staffList) {
      const select = document.getElementById('staffSelect');
      const cur = select.value;
      select.innerHTML = '<option value="">Select Staff...</option>';
      (staffList || []).forEach(s => select.innerHTML += `<option value="${s}">${s}</option>`);
      select.innerHTML += '<option value="__OTHER__">➕ Other / Enter Name</option>';
      if (cur) select.value = cur;
    }

    function toggleCustomStaff() {
      const sel = document.getElementById('staffSelect');
      const inp = document.getElementById('staffCustom');
      if (sel.value === "__OTHER__") {
        inp.classList.remove('hidden'); inp.required = true; inp.focus();
      } else {
        inp.classList.add('hidden'); inp.required = false; inp.value = '';
      }
    }

    function filterOptions(type, query) {
      closeAllDropdowns();
      const dropdownEl = document.getElementById(type + 'Dropdown');
      
      let items = [];
      if (type === 'driver') items = masterData.drivers;
      else if (type === 'truck') items = masterData.trucks;
      else if (type === 'guarantor') items = masterData.guarantors;

      const q = query.replace(/\s+/g, '').toUpperCase();
      const matched = q ? items.filter(i => i.toUpperCase().includes(q)) : items;

      let html = '';
      if (matched.length > 0) {
        matched.forEach(item => {
          html += `
            <div class="px-3 py-2.5 text-xs font-semibold hover:bg-amber-50 cursor-pointer border-b border-slate-100 flex justify-between items-center"
                 onclick="selectOption('${type}', '${item.replace(/'/g, "\\'")}')">
              <span>${item}</span>
              <span class="text-[10px] text-slate-400">Master</span>
            </div>`;
        });
      }

      const exactExists = items.some(i => i.toUpperCase() === q);
      if (q && !exactExists) {
        html += `
          <div class="px-3 py-2.5 text-xs font-bold text-amber-800 bg-amber-50 hover:bg-amber-100 cursor-pointer flex justify-between items-center"
               onclick="selectOption('${type}', '${q.replace(/'/g, "\\'")}')">
            <span>➕ Use "${q}"</span>
            <span class="text-[10px] bg-amber-200 text-amber-900 px-1.5 py-0.5 rounded">New</span>
          </div>`;
      }

      dropdownEl.innerHTML = html;
      dropdownEl.classList.remove('hidden');
    }

    function selectOption(type, value) {
      document.getElementById(type + 'Input').value = value;
      closeAllDropdowns();
    }

    function closeAllDropdowns() {
      ['driverDropdown', 'truckDropdown', 'guarantorDropdown'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      closeAllDropdowns();

      const staffSel = document.getElementById('staffSelect');
      const submittedBy = staffSel.value === "__OTHER__" ? document.getElementById('staffCustom').value.trim() : staffSel.value;
      const truckVal = document.getElementById('truckInput').value.replace(/\s+/g, '').toUpperCase();
      const advAmt = document.getElementById('advRequested').value.trim();

      const truckRegex = /^[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}$/;
      if (!truckRegex.test(truckVal)) {
        alert("Invalid Truck Number! Must follow standard format without space (e.g. MH18BZ0271).");
        return;
      }

      if (isNaN(advAmt) || Number(advAmt) <= 0) {
        alert("Please enter a valid Advance Amount Requested.");
        return;
      }

      lastSavedData = {
        submittedBy: submittedBy,
        driverName: document.getElementById('driverInput').value.trim(),
        truckNo: truckVal,
        totalDue: document.getElementById('totalDue').value.trim() || 0,
        advRequested: advAmt,
        dateOfCredit: document.getElementById('dateOfCredit').value,
        guarantor: document.getElementById('guarantorInput').value.trim(),
        remark: document.getElementById('remarkInput').value.trim() || "Regular Trip Advance"
      };

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving to Google Sheet...";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(lastSavedData)
        });

        document.getElementById('advanceForm').classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('shareSection').classList.remove('hidden');
        showToast("Saved to Advance DB!", "emerald");
      } catch (err) {
        document.getElementById('advanceForm').classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('shareSection').classList.remove('hidden');
        showToast("Saved to Sheet! (Check live rows).", "emerald");
      }
    }

    function handleWhatsAppShare() {
      if (!lastSavedData) return;

      const msg = 
`💵 *ADVANCE PAYMENT REQUEST*
━━━━━━━━━━━━━━━━━━
👤 *Driver:* ${lastSavedData.driverName}
🚚 *Truck No:* ${lastSavedData.truckNo}
💰 *Advance Requested:* ₹${lastSavedData.advRequested}
📋 *Total Due:* ₹${lastSavedData.totalDue}
📅 *Date of Credit:* ${lastSavedData.dateOfCredit}
🤝 *Guarantor:* ${lastSavedData.guarantor}
📝 *Remark:* ${lastSavedData.remark}
━━━━━━━━━━━━━━━━━━
👷 *Requested By:* ${lastSavedData.submittedBy}
*(Please reply with APPROVED / REJECTED)*`;

      window.location.href = "whatsapp://send?text=" + encodeURIComponent(msg);
      document.getElementById('shareBtn').innerText = "✓ Sent to WhatsApp (Tap to re-send)";
    }

    function resetForm() {
      document.getElementById('advanceForm').reset();
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateOfCredit').value = today;
      document.getElementById('advanceForm').classList.remove('opacity-50', 'pointer-events-none');
      document.getElementById('shareSection').classList.add('hidden');
      document.getElementById('staffCustom').classList.add('hidden');
      document.getElementById('staffCustom').required = false;

      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = false;
      saveBtn.innerText = "Record Request & Generate WhatsApp";
      hideToast();
      fetchMasters();
    }

    function showToast(text, color) {
      const toast = document.getElementById('statusToast');
      toast.className = `mt-3 text-center text-xs font-bold p-2.5 rounded-xl bg-${color}-100 text-${color}-800`;
      toast.innerText = text;
      toast.classList.remove('hidden');
    }

    function hideToast() {
      document.getElementById('statusToast').classList.add('hidden');
    }
  </script>
</body>
</html>
